name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: EBOOT
    # La imagen del contenedor va por etiqueta y no por digest a proposito:
    # un digest se queda clavado y nadie lo sube. El precio es que un pspdev
    # nuevo puede traer un warning y tumba la puerta de abajo; si pasa, se
    # mira el log y se actualiza el codigo o la imagen, que es el aviso.
    runs-on: ubuntu-24.04
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EBOOT.PBP
        shell: bash
        run: |
          set -euo pipefail
          make clean || true
          make 2>&1 | tee build.log
          if grep -iE "warning:|error:" build.log; then
            echo "::error::the build produced warnings or errors"
            exit 1
          fi
          sha256sum EBOOT.PBP

      - name: Stage the app folder
        run: |
          set -e
          mkdir -p dist/PSPTorque
          cp EBOOT.PBP dist/PSPTorque/EBOOT.PBP
          cp RUN.txt dist/PSPTorque/ 2>/dev/null || true

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: psp-torque
          path: |
            EBOOT.PBP
            dist/PSPTorque

  tests:
    name: Core tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run the host tests
        run: |
          set -e
          make -C tests clean || true
          make -C tests all

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the artefacts
        uses: actions/download-artifact@v4
        with:
          name: psp-torque

      - name: Zip the app folder
        run: |
          set -e
          ls -l dist
          cd dist && zip -r ../PSPTorque.zip PSPTorque

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EBOOT.PBP
            PSPTorque.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            PSP Torque ${{ github.ref_name }}.

            Copy `PSPTorque/EBOOT.PBP` from the zip to
            `ms0:/PSP/GAME/PSPTorque/` on the Memory Stick, or take the raw
            `EBOOT.PBP` if that folder already exists.
